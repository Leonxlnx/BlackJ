# Builds BlackJ.exe on Windows and publishes it as a GitHub release.
# Start it by pushing a tag like v1.9.0, or by hand (Actions > Release > Run workflow), which
# creates the tag v<version> from package.json on the chosen branch.
# The release text comes from docs/releases/v<version>.md.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Tag matches package.json and has release notes
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::docs/releases/v$version.md is missing"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Package BlackJ.exe
        shell: bash
        run: |
          npx electron-builder --win portable --publish never
          cp "release/BlackJ-${{ steps.version.outputs.version }}-portable.exe" BlackJ.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BlackJ ${{ steps.version.outputs.version }}
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: BlackJ.exe
